<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
        <title>Calculator</title>
        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Basic Arithmetic Calculator</h1>
            <input class="themebutton" type="checkbox" onclick="theme()">
        </header>
        <form>
            <h2>Calculator</h2>
            <input type="text" id="expression" name="expression" disabled>
            <div class="container">
                <button type="button" onclick="openp()">(</button>
                <button type="button" onclick="closep()">)</button>
                <button type="button" onclick="AC()">AC</button>
                <button type="button" onclick="back()"><--</button>

                <button type="button" onclick="one()">1</button>
                <button type="button" onclick="two()">2</button>
                <button type="button" onclick="three()">3</button>
                <button type="button" onclick="add()">+</button>

                <button type="button" onclick="four()">4</button>
                <button type="button" onclick="five()">5</button>
                <button type="button" onclick="six()">6</button>
                <button type="button" onclick="substract()">-</button>

                <button type="button" onclick="seven()">7</button>
                <button type="button" onclick="eight()">8</button>
                <button type="button" onclick="nine()">9</button>
                <button type="button" onclick="multiply()">x</button>

                <button type="button" onclick="dot()">.</button>
                <button type="button" onclick="zero()">0</button>
                <button type="button" onclick="calculate()">=</button>
                <button type="button" onclick="divide()">/</button>
            </div>
        </form>
        <footer>
            <h4>Made by: Alexander Charles L. Camayudo</h4>
            <h4>From AC11, BSITCST.</h4>
            <h4>Made for Web Development Practical 2.</h4>
        </footer>
    </body>
</html>
